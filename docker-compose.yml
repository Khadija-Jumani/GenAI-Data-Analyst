version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genai-data-analyst-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GenAI Data Analyst
      - APP_VERSION=0.1.0
      - DEBUG=True
      - API_PREFIX=/api/v1
      - ALLOWED_ORIGINS=http://localhost:3000
      - MAX_UPLOAD_SIZE_MB=50
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
    volumes:
      - ./datasets/sample:/app/datasets/sample:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
